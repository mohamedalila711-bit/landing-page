<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الهبوط - الجبال الثلجية</title>
    <style>
        /* تنسيقات عامة للصفحة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* تنسيق شريط التنقل العلوي (Navbar) */
        header {
            background-color: #1a1a1a;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        header nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        header nav ul li a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        header nav ul li a:hover {
            color: #00bcd4;
        }

        /* تنسيق قسم الواجهة الرئيسي (Hero Section) الذي يحتوي على خلفية الجبال */
        .hero {
            position: relative;
            height: 85vh;
            background-image: url('landing.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }
        /* طبقة تعتيم فوق الخلفية لجعل النص واضحاً وقابلاً للقراءة */
        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            padding: 0 20px;
        }
        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }
        .btn {
            background-color: #00bcd4;
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0097a7;
        }

        /* تنسيق تذييل الصفحة (Footer) */
        footer {
            background-color: #1a1a1a;
            color: #aaa;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- بداية شريط التنقل العلوي -->
    <header>
        <div class="logo">موقعي الطبيعي</div>
        <nav>
            <ul>
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#">عن الموقع</a></li>
                <li><a href="#">الخدمات</a></li>
                <li><a href="#">اتصل بنا</a></li>
            </ul>
        </nav>
    </header>
    <!-- نهاية شريط التنقل العلوي -->

    <!-- بداية القسم الرئيسي (Hero Section) مع صورة الجبال الثلجية -->
    <section class="hero">
        <div class="hero-content">
            <h1>استكشف روعة الطبيعة الجبلية</h1>
            <p>تصميم صفحة هبوط تفاعلية باستخدام لغة HTML وتنسيقات CSS المتقدمة، تعرض جمال القمم الثلجية الساحرة.</p>
            <a href="#" class="btn">اكتشف المزيد</a>
        </div>
    </section>
    <!-- نهاية القسم الرئيسي -->

    <!-- بداية تذييل الصفحة (Footer) -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - تم التطوير ضمن متطلبات مساق تصميم وإدارة مواقع الإنترنت.</p>
    </footer>
    <!-- نهاية تذييل الصفحة -->

</body>
</html>
